# Uploads the Android SDK (io.github.syjdev:pixel-blur-detector) to the Maven Central Portal when a
# version tag such as 3.0.0 is pushed. The upload is not released automatically: review it at
# https://central.sonatype.com/publishing/deployments and press "Publish".
#
# It can also be run by hand (Actions › Publish Android SDK › Run workflow) to try the upload
# before tagging. Drop that deployment on the Central Portal instead of publishing it.
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  Central Portal user token
#   SIGNING_KEY                                     ASCII-armored GPG secret key
#   SIGNING_KEY_PASSWORD                            Passphrase of that key
name: Publish Android SDK

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches VERSION_NAME
        if: github.event_name == 'push'
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version in android/gradle.properties"
            exit 1
          fi

      - name: Test
        run: ./gradlew :pixel-blur-detector:testDebugUnitTest

      - name: Upload to Maven Central
        run: ./gradlew :pixel-blur-detector:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
